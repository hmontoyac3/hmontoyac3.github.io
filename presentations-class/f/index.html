<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persuasive Presentations 20941 · today's link</title>
<style>
  :root {
    --paper:#F4F6F9; --card:#FFF; --ink:#14171D; --ink-soft:#4E5665; --ink-faint:#8A93A2;
    --rule:#D9DFE8; --blue:#0F4179; --blue-bg:#E6EEF7; --ok:#1B6E3C; --ok-bg:#E6F3EA;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#0D1014; --card:#151A20; --ink:#E9ECF1; --ink-soft:#9BA4B3; --ink-faint:#69727F;
            --rule:#293039; --blue:#7DB0E6; --blue-bg:#132330; --ok:#7CC79A; --ok-bg:#16251C; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
         font-size:17px; line-height:1.45; padding:18px 16px 64px; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 2px; letter-spacing:-.01em; }
  .sub { color:var(--ink-soft); font-size:14px; margin:0 0 18px; }
  .classpick { display:flex; gap:8px; margin:0 0 20px; }
  .classpick button { flex:1; font:inherit; font-size:15px; padding:11px; background:var(--card);
    color:var(--ink); border:1px solid var(--rule); border-radius:9px; }
  .classpick button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .warn { background:var(--blue-bg); border:1px solid var(--rule); border-radius:9px;
          padding:11px 13px; font-size:14px; color:var(--ink-soft); margin:0 0 18px; }
  ol.list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; }
  ol.list button { width:100%; text-align:left; font:inherit; background:var(--card); color:var(--ink);
    border:1px solid var(--rule); border-radius:11px; padding:13px 14px; display:flex; gap:13px; align-items:flex-start; }
  .num { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--blue);
         border:1px solid var(--rule); border-radius:7px; min-width:30px; padding:3px 0; text-align:center; flex:none; }
  .ttl { font-weight:600; font-size:16px; display:block; }
  .whn { color:var(--ink-faint); font-size:12.5px; font-family:var(--mono); letter-spacing:.04em; }
  .done .num { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .done .ttl { color:var(--ink-soft); }
  fieldset { border:0; padding:0; margin:0 0 22px; }
  label.q { display:block; font-weight:600; font-size:16px; margin:0 0 3px; }
  .hint { color:var(--ink-faint); font-size:13.5px; margin:0 0 8px; }
  input[type=text], select { width:100%; font:inherit; padding:11px 12px; background:var(--card);
    color:var(--ink); border:1px solid var(--rule); border-radius:9px; }
  .opts { display:flex; flex-wrap:wrap; gap:7px; }
  .opts label { font-size:15px; padding:9px 13px; background:var(--card); border:1px solid var(--rule);
                border-radius:20px; cursor:pointer; }
  .opts input { position:absolute; opacity:0; width:0; height:0; }
  .opts label:has(input:checked) { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .sc { display:flex; flex-wrap:wrap; gap:5px; }
  .sc label { font-family:var(--mono); font-size:15px; min-width:40px; text-align:center;
              padding:9px 0; flex:1; background:var(--card); border:1px solid var(--rule); border-radius:8px; }
  .sc input { position:absolute; opacity:0; width:0; height:0; }
  .sc label:has(input:checked) { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--paper);
         border-top:1px solid var(--rule); padding:10px 16px; }
  .bar .in { max-width:640px; margin-inline:auto; display:flex; gap:9px; }
  .bar button { flex:1; font:inherit; font-size:16px; font-weight:600; padding:13px;
                border-radius:10px; border:1px solid var(--blue); background:var(--blue); color:#fff; }
  .bar button.ghost { flex:0 0 96px; background:var(--card); color:var(--ink-soft); border-color:var(--rule); font-weight:400; }
  .bar button[disabled] { opacity:.55; }
  .msg { margin:14px 0 0; font-size:15px; padding:12px 13px; border-radius:9px; border:1px solid var(--rule); }
  .msg.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .msg.err { background:var(--blue-bg); }
  .thanks { text-align:center; padding:34px 0; }
  .thanks .big { font-size:40px; line-height:1; margin-bottom:12px; }
  [hidden] { display:none !important; }
</style>

<div id="app"></div>
<iframe name="sink" id="sink" hidden></iframe>

<script src="form.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cls = localStorage.getItem('sem20941.class') || '';
  var sentKey = 'sem20941.sent';
  function sent() { try { return JSON.parse(localStorage.getItem(sentKey)) || {}; } catch (e) { return {}; } }
  function markSent(slot) { var s = sent(); s[slot] = 1; localStorage.setItem(sentKey, JSON.stringify(s)); }
  function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function slotOf(f) { return f.slot === 'q1' ? 'q1-' + (cls || 'fin') : f.slot; }

  /* ---------- la lista ---------- */
  function renderList() {
    var s = sent();
    app.innerHTML =
      '<h1>Persuasive Presentations</h1>' +
      '<p class="sub">Behavioural Skills Seminar 20941. Keep this tab open all day: everything I ask you for is on this page.</p>' +
      '<div class="classpick">' +
        '<button id="c-fin" aria-pressed="' + (cls === 'fin') + '">MSc Finance · cl. 44</button>' +
        '<button id="c-afm" aria-pressed="' + (cls === 'afm') + '">Accounting &amp; FM · cl. 41</button>' +
      '</div>' +
      (cls ? '' : '<p class="warn">Pick your class first. Form 1 is different for each one.</p>') +
      '<ol class="list">' + FORMS.map(function (f) {
        var done = s[slotOf(f)];
        return '<li><button data-open="' + f.n + '" class="' + (done ? 'done' : '') + '">' +
          '<span class="num">' + (done ? '✓' : f.n) + '</span><span><span class="ttl">' + esc(f.title) + '</span>' +
          '<span class="whn">' + esc(f.when) + (done ? ' · sent' : '') + '</span></span></button></li>';
      }).join('') + '</ol>';

    document.getElementById('c-fin').onclick = function () { setClass('fin'); };
    document.getElementById('c-afm').onclick = function () { setClass('afm'); };
    Array.prototype.forEach.call(app.querySelectorAll('[data-open]'), function (b) {
      b.onclick = function () { location.hash = '#' + b.getAttribute('data-open'); };
    });
  }
  function setClass(c) { cls = c; localStorage.setItem('sem20941.class', c); route(); }

  /* ---------- un formulario ---------- */
  function field(f) {
    var head = '<label class="q" for="' + f.name + '">' + esc(f.label) + '</label>' +
               (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '');
    if (f.type === 'radio') {
      return head + '<div class="opts">' + f.options.map(function (o, k) {
        return '<label><input type="radio" name="' + f.name + '" value="' + esc(o) + '"' +
               (k === 0 ? ' data-first' : '') + '>' + esc(o) + '</label>';
      }).join('') + '</div>';
    }
    if (f.type === 'scale') {
      var out = '<div class="sc">';
      for (var i = 0; i <= 10; i++) out += '<label><input type="radio" name="' + f.name + '" value="' + i + '">' + i + '</label>';
      return head + out + '</div>';
    }
    if (f.type === 'firm') {
      var list = RECRUITERS[cls] || [];
      return head + '<input type="text" id="' + f.name + '" name="' + f.name + '" list="firms" autocomplete="off" ' +
             'placeholder="Type or pick. Not on the list? Write it in.">' +
             (document.getElementById('firms') ? '' :
               '<datalist id="firms">' + list.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>');
    }
    if (f.type === 'word') {
      return head + '<input type="text" id="' + f.name + '" name="' + f.name + '" maxlength="24" autocomplete="off" placeholder="one word">';
    }
    return head + '<input type="text" id="' + f.name + '" name="' + f.name + '" autocomplete="off">';
  }

  function renderForm(f) {
    app.innerHTML =
      '<p class="whn">Form ' + f.n + ' · ' + esc(f.when) + '</p>' +
      '<h1>' + esc(f.title) + '</h1>' +
      '<p class="sub">' + esc(f.blurb) + '</p>' +
      '<form id="frm">' + f.fields.map(function (x) { return '<fieldset>' + field(x) + '</fieldset>'; }).join('') +
      '<div id="msg"></div></form>' +
      '<div class="bar"><div class="in">' +
        '<button type="button" class="ghost" id="back">Back</button>' +
        '<button type="button" id="send">Send</button>' +
      '</div></div>';

    document.getElementById('back').onclick = function () { location.hash = ''; };
    document.getElementById('send').onclick = function () { submit(f); };
  }

  function collect(f) {
    var out = {}, missing = 0;
    f.fields.forEach(function (x) {
      var el = document.querySelector('[name="' + x.name + '"]:checked') ||
               document.querySelector('input[name="' + x.name + '"]');
      var v = el ? String(el.value || '').trim() : '';
      if (!v) missing++;
      out[x.name] = v;
    });
    return { values: out, missing: missing };
  }

  function submit(f) {
    var got = collect(f), msg = document.getElementById('msg'), btn = document.getElementById('send');
    var filled = Object.keys(got.values).filter(function (k) { return got.values[k]; }).length;
    if (!filled) { msg.className = 'msg err'; msg.textContent = 'Nothing to send yet.'; return; }

    btn.disabled = true; btn.textContent = 'Sending…';
    msg.className = ''; msg.textContent = '';

    var slot = slotOf(f);
    var body = new URLSearchParams({ slot: slot, payload: JSON.stringify(got.values) });

    /* Se manda como form-urlencoded a propósito: así el navegador NO
       dispara la petición previa de CORS, que es donde Apps Script
       suele fallar. Y si aun así falla, va el plan B por iframe, que
       no lee la respuesta y por tanto CORS no le afecta. */
    fetch(ENDPOINT, { method: 'POST', body: body })
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function () { done(f, slot); })
      .catch(function () { viaIframe(f, slot, got.values); });
  }

  function viaIframe(f, slot, values) {
    var fm = document.createElement('form');
    fm.method = 'POST'; fm.action = ENDPOINT; fm.target = 'sink'; fm.hidden = true;
    [['slot', slot], ['payload', JSON.stringify(values)]].forEach(function (kv) {
      var i = document.createElement('input'); i.type = 'hidden'; i.name = kv[0]; i.value = kv[1]; fm.appendChild(i);
    });
    document.body.appendChild(fm);
    fm.submit();
    setTimeout(function () { done(f, slot); }, 900);
  }

  function done(f, slot) {
    markSent(slot);
    app.innerHTML = '<div class="thanks"><div class="big">✓</div>' +
      '<h1>Sent</h1><p class="sub">Form ' + f.n + '. Leave this tab open, there is more later.</p></div>' +
      '<div class="bar"><div class="in"><button type="button" id="back">Back to the list</button></div></div>';
    document.getElementById('back').onclick = function () { location.hash = ''; };
  }

  /* ---------- rutas ---------- */
  function route() {
    var n = parseInt((location.hash || '').replace('#', ''), 10);
    var f = FORMS.filter(function (x) { return x.n === n; })[0];
    if (!f) { renderList(); return; }
    if (f.slot === 'q1' && !cls) { location.hash = ''; return; }
    renderForm(f);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
